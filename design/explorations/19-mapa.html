<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NESS · Rotas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
/* Layout: mapa em tela cheia (Uber/Mapbox) — rotas animadas do estúdio até cada entrega; painel flutuante com o pedido escolhido. */
:root{--bg:#F3F4F6;--map:#E9EBEE;--road:#FFFFFF;--surface:#FFFFFF;--fg:#0B0B0B;--muted:#5E5E5E;--line:#E2E2E2;--accent:#0B0B0B;--route:#276EF1;--ok:#05944F;--wait:#276EF1;--err:#C3271B;--block:#8A5A00;--draft:#5E5E5E;--logo-accent:#276EF1;font-family:Rubik,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0B0B;--map:#16181B;--road:#24272C;--surface:#1C1D20;--fg:#F4F4F4;--muted:#A6A6A6;--line:#2C2D31;--accent:#F4F4F4;--route:#5B9BFF;--ok:#3CCB7F;--wait:#5B9BFF;--err:#FF7066;--block:#F5B54A;--draft:#A6A6A6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0B0B;--map:#16181B;--road:#24272C;--surface:#1C1D20;--fg:#F4F4F4;--muted:#A6A6A6;--line:#2C2D31;--accent:#F4F4F4;--route:#5B9BFF;--ok:#3CCB7F;--wait:#5B9BFF;--err:#FF7066;--block:#F5B54A;--draft:#A6A6A6;color-scheme:dark}
html,body{height:100%}
.map{position:fixed;inset:0;background:var(--map);overflow:hidden}
.map svg{width:100%;height:100%}
.road{stroke:var(--road);fill:none}
.route{fill:none;stroke:var(--route);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:8 10;animation:dash 1.2s linear infinite;opacity:.35;transition:opacity .3s}
.route.on{opacity:1;stroke-width:5}
@keyframes dash{to{stroke-dashoffset:-36}}
.pin{cursor:pointer}
.pin circle.halo{fill:var(--route);opacity:.18;transform-box:fill-box;transform-origin:center;animation:halo 2s ease-out infinite}
@keyframes halo{from{transform:scale(.6);opacity:.4}to{transform:scale(2.4);opacity:0}}
.pin circle.dot{fill:var(--surface);stroke:var(--fg);stroke-width:3;transition:r .2s}
.pin:hover circle.dot,.pin.on circle.dot{r:11;fill:var(--route);stroke:var(--surface)}
.pin text{font:600 13px Rubik,sans-serif;fill:var(--fg);paint-order:stroke;stroke:var(--map);stroke-width:4px}
.studio rect{fill:var(--fg)}
.top{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;z-index:2}
.chipbar{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:8px 14px;box-shadow:0 4px 16px #0002;font-weight:700}
.chipbar nav{display:flex;gap:2px;overflow-x:auto}
.chipbar .nav-item svg{display:none}
.chipbar .nav-item{white-space:nowrap;font-size:13px;border-radius:999px}
.sp{flex:1}
.circ{width:44px;height:44px;border-radius:50%;background:var(--surface);border:0;display:grid;place-items:center;box-shadow:0 4px 16px #0002}
.sheet{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100% - 32px));background:var(--surface);border-radius:20px;box-shadow:0 10px 40px #0003;padding:20px;display:grid;gap:14px;z-index:2}
.sheet h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.sheet .sub{color:var(--muted);font-size:14px}
.trip{display:grid;grid-template-columns:16px 1fr;gap:4px 12px;font-size:14px}
.trip .a,.trip .b{width:10px;height:10px;margin-top:5px}
.trip .a{background:var(--fg);border-radius:2px}.trip .b{border:2px solid var(--fg);border-radius:50%}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.docs div{background:var(--bg);border-radius:12px;padding:10px;display:grid;gap:6px;font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--fg);color:var(--bg);border-radius:12px;padding:14px;font-weight:600;font-size:16px;transition:transform .2s}
.btn:hover{transform:scale(1.02)}
.stats{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:2;width:220px}
.kpi{background:var(--surface);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;column-gap:10px;box-shadow:0 4px 16px #0002;transition:transform .2s}
.kpi:hover{transform:translateX(-4px)}
.kpi-ic{grid-row:span 3;color:var(--route)}
.kpi-label{font-size:12px;color:var(--muted)}.kpi-v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}.kpi-note{font-size:11.5px;color:var(--muted)}
.disc{position:fixed;right:16px;top:calc(76px + env(safe-area-inset-top,0px));font-size:11px;color:var(--muted)}
@media (max-width:900px){.stats{display:none}.chipbar nav{display:none}}
</style>
</head>
<body>
<div class="map" aria-hidden="true"><svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" id="svg">
  <g class="road" stroke-width="10"><path d="M0 400H1200M600 0V800M0 120L1200 700M200 0L900 800M1200 150L0 650"/></g>
  <g class="road" stroke-width="4" opacity=".7"><path d="M0 250H1200M0 560H1200M300 0V800M900 0V800M450 0L1100 800M0 300L700 0"/></g>
  <g id="routes"></g><g id="pins"></g>
  <g class="studio"><rect x="588" y="388" width="24" height="24" rx="5"/></g>
</svg></div>
<div class="top"><div class="chipbar"><span data-logo="22"></span>NESS<nav data-nav></nav></div><span class="sp"></span><button class="circ" data-theme-toggle aria-label="Alternar tema"><i data-lucide="sun-moon"></i></button></div>
<p class="disc">Mapa ilustrativo</p>
<section class="sheet" data-reveal aria-live="polite">
  <div><h1>Para onde vai o álbum?</h1><p class="sub" id="sub"></p></div>
  <div class="trip"><span class="a"></span><span>Estúdio Matriz · São Paulo/SP</span><span class="b"></span><span id="dest"></span></div>
  <div class="docs" id="docs"></div>
  <a href="#" class="btn"><i data-lucide="plus"></i>Novo pedido</a>
</section>
<aside class="stats" data-kpis></aside>
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<script src="shared.js"></script>
<script>
const pts=[[760,300],[300,180],[680,560],[360,640],[540,470]];
const O=NESS.orders;
document.getElementById('routes').innerHTML=pts.map((p,i)=>`<path class="route" data-i="${i}" d="M600 400 Q ${(600+p[0])/2+80} ${(400+p[1])/2-90} ${p[0]} ${p[1]}"/>`).join('');
document.getElementById('pins').innerHTML=pts.map((p,i)=>`<g class="pin" data-i="${i}"><circle class="halo" cx="${p[0]}" cy="${p[1]}" r="12"/><circle class="dot" cx="${p[0]}" cy="${p[1]}" r="8"/><text x="${p[0]+16}" y="${p[1]+5}">${O[i].dest}</text></g>`).join('');
document.querySelector('.map').removeAttribute('aria-hidden');
function sel(i){const o=O[i];document.querySelectorAll('.route,.pin').forEach(e=>e.classList.toggle('on',+e.dataset.i===i));document.getElementById('sub').textContent=`${o.ref} · ${o.cli} · ${o.val}`;document.getElementById('dest').textContent=o.dest;document.getElementById('docs').innerHTML=`<div><span class="muted">NFS-e · serviço</span>${NESS.badge(o.nfse)}</div><div><span class="muted">NF-e · álbum</span>${NESS.badge(o.nfe)}</div>`;lucide.createIcons()}
document.getElementById('pins').addEventListener('click',e=>{const g=e.target.closest('.pin');if(g)sel(+g.dataset.i)});
NESS.render({stroke:2});sel(1);
</script>
</body>
</html>
