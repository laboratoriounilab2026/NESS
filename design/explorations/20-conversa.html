<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NESS · Conversa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
/* Layout: conversa primeiro (ChatGPT/Intercom) — o hero é uma caixa de pedido em linguagem natural; respostas trazem cartões de ação com confirmação humana. */
:root{--bg:#FFFFFF;--side:#F9F9F9;--surface:#F4F4F4;--fg:#0D0D0D;--muted:#6B6B6B;--line:#E6E6E6;--accent:#0D0D0D;--ok:#127A3F;--wait:#1E5FD6;--err:#C42B1C;--block:#8A5A00;--draft:#6B6B6B;--logo-accent:#E8A33D;font-family:"Instrument Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#212121;--side:#171717;--surface:#2F2F2F;--fg:#ECECEC;--muted:#A3A3A3;--line:#3A3A3A;--accent:#ECECEC;--ok:#4CD58A;--wait:#7AABFF;--err:#FF7A6E;--block:#F5B54A;--draft:#A3A3A3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#212121;--side:#171717;--surface:#2F2F2F;--fg:#ECECEC;--muted:#A3A3A3;--line:#3A3A3A;--accent:#ECECEC;--ok:#4CD58A;--wait:#7AABFF;--err:#FF7A6E;--block:#F5B54A;--draft:#A3A3A3;color-scheme:dark}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--side);padding:12px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;gap:8px;align-items:center;font-weight:700;padding:6px 8px}
.hist{display:grid;gap:2px;font-size:14px}
.hist small{color:var(--muted);padding:8px 8px 4px;font-size:12px;font-weight:600}
.hist a{padding:8px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist a:hover{background:var(--surface)}
main{display:flex;flex-direction:column;min-width:0}
.bar{display:flex;justify-content:space-between;padding:12px max(16px,2vw)}
.bar button{border:0;background:none;padding:8px;border-radius:8px}
.bar button:hover{background:var(--surface)}
.thread{flex:1;width:min(760px,100%);margin:0 auto;padding:0 max(16px,2vw) 24px;display:flex;flex-direction:column;gap:22px}
.hero{display:grid;justify-items:center;text-align:center;gap:10px;padding:8vh 0 10px}
.hero h1{font-size:clamp(26px,3.4vw,36px);font-weight:600;letter-spacing:-.02em}
.hero p{color:var(--muted)}
.composer{width:min(760px,100%);margin:0 auto;padding:0 max(16px,2vw) calc(20px + env(safe-area-inset-bottom,0px));position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%)}
.box{background:var(--surface);border-radius:26px;padding:10px 10px 10px 20px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);transition:box-shadow .2s}
.box:focus-within{box-shadow:0 0 0 2px var(--line)}
.box input{all:unset;flex:1;font-size:16px;min-width:0}
.send{width:38px;height:38px;border-radius:50%;background:var(--fg);color:var(--bg);border:0;display:grid;place-items:center;transition:transform .2s}
.send:hover{transform:scale(1.08)}
.sug{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.sug button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-size:14px;display:inline-flex;gap:6px;align-items:center;transition:background .2s,transform .2s}
.sug button:hover{background:var(--surface);transform:translateY(-2px)}
.me{align-self:flex-end;background:var(--surface);border-radius:20px;padding:10px 16px;max-width:80%}
.ai{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.ai .av{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:4px;animation:tp 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{transform:translateY(-5px);opacity:.4}}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:10px;display:grid;gap:12px;animation:rise .5s var(--ease)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair div{background:var(--surface);border-radius:12px;padding:12px;display:grid;gap:6px;font-size:14px}
.pair small{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:9px 16px;font-weight:600;border:1px solid var(--line);background:var(--bg)}
.btn.p{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:hover{filter:brightness(.95)}
@media (max-width:860px){.app{grid-template-columns:1fr}aside{display:none}.pair{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside><div class="brand"><span data-logo="24"></span>NESS</div><nav data-nav style="display:grid;gap:2px"></nav><div class="hist"><small>Hoje</small><a href="#">Emitir PED-2418 · Marina Costa</a><a href="#">Por que a NF-e do PED-2416 voltou?</a><small>Ontem</small><a href="#">Regra fiscal para o Paraná</a></div></aside>
  <main>
    <div class="bar"><b>NESS</b><button data-theme-toggle aria-label="Alternar tema"><i data-lucide="sun-moon"></i></button></div>
    <div class="thread" id="thread" aria-live="polite">
      <section class="hero" data-reveal><span data-logo="48"></span><h1>O que vamos emitir hoje?</h1><p>3 pedidos prontos · 2 parciais. Escreva do seu jeito, eu preparo e você confirma.</p></section>
    </div>
    <div class="composer">
      <form class="box" id="f"><input id="q" placeholder="Ex.: emitir o pedido da Ana e Pedro" aria-label="Mensagem"><button class="send" aria-label="Enviar"><i data-lucide="arrow-up"></i></button></form>
      <div class="sug" id="sug"><button data-s="0"><i data-lucide="send"></i>Emitir pedido da Ana e Pedro</button><button data-s="1"><i data-lucide="alert-triangle"></i>Por que o PED-2416 falhou?</button><button data-s="2"><i data-lucide="plus"></i>Novo pedido</button></div>
    </div>
  </main>
</div>
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<script src="shared.js"></script>
<script>
const T=document.getElementById('thread');
const R=[
 ['Emitir pedido da Ana e Pedro',`Preparei o <b>PED-2414</b>. Confira antes de emitir:<div class="card"><div class="pair"><div><small>NFS-e · serviço</small><b>Newborn</b><span>R$ 1.080,00</span></div><div><small>NF-e · mercadoria</small><b>Caixa de fotos</b><span>R$ 300,00 · São Paulo/SP</span></div></div><small class="muted">Regra fiscal aprovada e vigente encontrada. Tomador e destinatário: Ana Lima.</small><div class="row"><button class="btn p" data-confirm><i data-lucide="check"></i>Confirmar e emitir</button><button class="btn">Revisar no assistente</button></div></div>`],
 ['Por que o PED-2416 falhou?',`A <b>NFS-e foi autorizada</b>, mas a <b>NF-e foi rejeitada</b> pela SEFAZ-SP: o CEP do destinatário não bate com o município (Santos/SP).<div class="card"><div class="row">${NESS.badge('ok')} ${NESS.badge('err')}</div><div class="row"><button class="btn p"><i data-lucide="pencil"></i>Corrigir CEP e reenviar só a NF-e</button></div></div>`],
 ['Novo pedido','Claro. Qual é o cliente? Pode ser nome, CPF ou CNPJ. Depois eu pergunto o pacote, o álbum e o endereço de entrega.'],
];
function say(i,text){
  document.querySelector('.hero')?.remove();
  T.insertAdjacentHTML('beforeend',`<div class="me">${text}</div><div class="ai"><span class="av" data-logo="18"></span><div class="typing"><span></span><span></span><span></span></div></div>`);
  const last=T.lastElementChild;last.querySelector('[data-logo]').innerHTML=NESS.logo(18);
  setTimeout(()=>{last.querySelector('.typing').outerHTML=`<div>${R[i][1]}</div>`;lucide.createIcons();last.scrollIntoView({behavior:'smooth',block:'end'})},900);
}
document.getElementById('sug').onclick=e=>{const b=e.target.closest('[data-s]');if(b)say(+b.dataset.s,R[b.dataset.s][0])};
document.getElementById('f').onsubmit=e=>{e.preventDefault();const v=q.value.trim();if(!v)return;q.value='';say(/falh|2416/i.test(v)?1:/novo/i.test(v)?2:0,v.replace(/</g,'&lt;'))};
T.addEventListener('click',e=>{const b=e.target.closest('[data-confirm]');if(!b)return;b.closest('.card').insertAdjacentHTML('beforeend',`<div class="row">${NESS.badge('wait')}<span class="muted">Exemplo: nada foi enviado. No real, mostro o protocolo quando o governo responder.</span></div>`);b.disabled=true;lucide.createIcons()});
NESS.render();
</script>
</body>
</html>
